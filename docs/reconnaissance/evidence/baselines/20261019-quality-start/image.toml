# Remix returned-image controls ONLY. Original SFC scene/HUD and lights/materials stay unchanged.
# Save during the light-tuning session to reload. Invalid edits keep last good values.
# Restore by copying image.example.toml over this file, then saving.
[image]
enabled = true                 # false restores the tested startup image baseline
tone_mapping = "local"          # "local" (existing default) or "global"
automatic_exposure = false        # existing default; false stops automatic scene adaptation
brightness = 25                  # 0..100; 50 neutral, mapped through native exposure
exposure_ev = 0.0               # -4..4 stops; +1 doubles exposure factor, -1 halves it
contrast = 1.05                   # 0..2; 1 neutral, lower flatter, higher stronger
gamma = 0.9                      # 0.25..4; >1 brightens midtones, <1 darkens
saturation = 1.2                 # 0..2; 0 grey, 1 neutral, >1 stronger colour
