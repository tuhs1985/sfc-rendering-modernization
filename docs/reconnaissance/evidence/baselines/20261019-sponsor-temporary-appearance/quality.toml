# Conservative comparison profile, NOT a certified SFC visual match.
# Accepted Community Edition wrapper forces16x filtering and8x MSAA.
# Remix temporal AA is NOT8x MSAA. Start with it off to isolate temporal softening.
[quality]
enabled = true
texture_filtering = "anisotropic" # "trilinear" or "anisotropic"
max_anisotropy = 16             # 1,2,4,8,16; used only for anisotropic filtering
mip_bias = 0.0                   # -1..1;0neutral,negative may shimmer
anti_aliasing = "off"            # "off" or "temporal" (native-resolution TAA)
denoising = true                 # false is noisy ray-tracing diagnostic,not SFC rendering
supersampling = 1.0              # only1.0qualified;larger factors rejected,not fake upscaling
